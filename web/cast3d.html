<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cast in 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      :root { --blue: #0b1a7a; --ink: #f4f1ff; --muted: #a9b2ff; }
      html, body { margin: 0; height: 100%; background: var(--blue); color: var(--ink); font-family: Inter, system-ui, sans-serif; overflow: hidden; }
      canvas { display: block; }
      .title { position: fixed; top: 20px; left: 24px; right: 24px; pointer-events: none; }
      .title h1 { font-family: Fraunces, Georgia, serif; font-weight: 800; margin: 0; font-size: clamp(24px, 4vw, 48px); text-shadow: 0 0 24px #ff9a3c88; }
      .title p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
      .names { position: fixed; bottom: 22px; left: 0; right: 0; display: flex; justify-content: space-around; pointer-events: none; padding: 0 16px; }
      .names span { font-family: Fraunces, Georgia, serif; font-size: clamp(13px, 1.6vw, 20px); text-shadow: 0 0 14px var(--c); color: #fff; }
      #status { position: fixed; top: 50%; left: 0; right: 0; text-align: center; color: var(--muted); }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div class="title">
      <h1>Who Ate the Pie?</h1>
      <p>Detective Goldilocks and her three suspects. Drag to orbit.</p>
    </div>
    <div id="status">Loading the cast…</div>
    <div class="names" id="names"></div>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
      import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
      import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";

      // Height of each character relative to Goldilocks, and where they stand.
      const CAST = [
        { id: "papa", name: "Papa Bear", height: 1.45, x: -2.3, color: "#ff6a3d" },
        { id: "goldilocks", name: "Detective Goldilocks", height: 1.0, x: -0.75, color: "#ffb020" },
        { id: "mama", name: "Mama Bear", height: 1.32, x: 0.75, color: "#ff9bd2" },
        { id: "baby", name: "Baby Bear", height: 0.72, x: 2.1, color: "#3ee6c4" },
      ];

      const FACING = Number(new URLSearchParams(location.search).get("facing") ?? -Math.PI / 2);
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;
      document.body.prepend(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color("#0b1a7a");
      scene.fog = new THREE.Fog("#0b1a7a", 7, 16);

      const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
      camera.position.set(0, 1.0, 7.2);
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0.7, 0);
      controls.enableDamping = true;
      controls.minDistance = 3;
      controls.maxDistance = 12;

      scene.add(new THREE.HemisphereLight("#b9c3ff", "#1a0f3a", 1.2));
      const key = new THREE.DirectionalLight("#ffe2c4", 2.2);
      key.position.set(2, 4, 5);
      scene.add(key);
      const rim = new THREE.DirectionalLight("#7f5bff", 3.0);
      rim.position.set(-3, 3, -4);
      scene.add(rim);

      // A soft glowing floor disc for them to stand on.
      const floor = new THREE.Mesh(
        new THREE.CircleGeometry(4.2, 64),
        new THREE.MeshStandardMaterial({ color: "#101a6e", emissive: "#2a2bd6", emissiveIntensity: 0.12, roughness: 0.8 }),
      );
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      const composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));
      const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.7, 0.5, 0.68);
      composer.addPass(bloom);
      composer.addPass(new OutputPass());

      // Turn each mesh into glowing, iridescent "glass".
      function glassify(root) {
        root.traverse((o) => {
          if (!o.isMesh) return;
          const old = o.material;
          o.material = new THREE.MeshPhysicalMaterial({
            map: old.map ?? null,
            color: old.color ?? new THREE.Color("#ffffff"),
            roughness: 0.35,
            metalness: 0.0,
            clearcoat: 1,
            clearcoatRoughness: 0.2,
            iridescence: 1,
            iridescenceIOR: 1.6,
            iridescenceThicknessRange: [180, 650],
            sheen: 1,
            sheenColor: new THREE.Color("#ff9be8"),
            emissive: new THREE.Color("#ffffff"),
            emissiveMap: old.map ?? null,
            emissiveIntensity: 0.3,
          });
        });
      }

      const loader = new GLTFLoader();
      loader.setMeshoptDecoder(MeshoptDecoder);
      const actors = [];
      const results = await Promise.allSettled(
        CAST.map(
          (c) =>
            new Promise((resolve, reject) =>
              loader.load(
                `/assets/models/${c.id}.glb`,
                (gltf) => {
                  const model = gltf.scene;
                  glassify(model);
                  // Tripo exports face sideways; turn them to face the camera.
                  model.rotation.y = FACING;
                  model.updateMatrixWorld(true);
                  const box = new THREE.Box3().setFromObject(model);
                  const size = box.getSize(new THREE.Vector3());
                  model.scale.setScalar((1.4 * c.height) / size.y);
                  model.updateMatrixWorld(true);
                  const box2 = new THREE.Box3().setFromObject(model);
                  const center = box2.getCenter(new THREE.Vector3());
                  model.position.set(-center.x, -box2.min.y, -center.z);
                  // The holder stands at the character's spot and sways in place.
                  const holder = new THREE.Group();
                  holder.position.x = c.x;
                  holder.add(model);
                  scene.add(holder);
                  actors.push({ holder, phase: Math.random() * Math.PI * 2 });
                  resolve(c);
                },
                undefined,
                reject,
              ),
            ),
        ),
      );
      const loaded = results.filter((r) => r.status === "fulfilled").map((r) => r.value);
      document.getElementById("status").textContent = loaded.length ? "" : "No 3D models yet. Run npm run art -- 3d <character> <image>.";
      document.getElementById("names").innerHTML = CAST.filter((c) => loaded.includes(c))
        .map((c) => `<span style="--c:${c.color}">${c.name}</span>`)
        .join("");

      const clock = new THREE.Clock();
      function frame() {
        const t = clock.getElapsedTime();
        for (const a of actors) {
          a.holder.rotation.y = Math.sin(t * 0.6 + a.phase) * 0.35;
          a.holder.position.y = Math.abs(Math.sin(t * 1.6 + a.phase)) * 0.04;
        }
        controls.update();
        composer.render();
        requestAnimationFrame(frame);
      }
      frame();

      addEventListener("resize", () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
        composer.setSize(innerWidth, innerHeight);
      });
    </script>
  </body>
</html>
